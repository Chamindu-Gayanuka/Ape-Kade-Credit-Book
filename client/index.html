<!doctype html>
<html lang="si">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="theme-color" content="#240046"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <link rel="manifest" href="/manifest.webmanifest"/>
    <link rel="icon" href="/app-icon.svg"/>
    <title>අපේ කඩේ ණය පොත</title>
    <script>
        try {
            const theme = localStorage.getItem('ape-kade-theme');
            if (theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        } catch (_) {
        }

        // This executes before the React bundle. It removes old production PWA workers
        // that may still control localhost and serve a stale protected page at /login.
        if ((location.hostname === 'localhost' || location.hostname === '127.0.0.1') &&
            'serviceWorker' in navigator && !sessionStorage.getItem('ape-kade-dev-sw-cleared')) {
            Promise.all([
                navigator.serviceWorker.getRegistrations().then(items =>
                    Promise.all(items.map(item => item.unregister())).then(() => items.length)
                ),
                'caches' in window ? caches.keys().then(keys =>
                    Promise.all(keys.filter(key => key.startsWith('ape-kade-')).map(key => caches.delete(key)))
                        .then(() => keys.length)
                ) : Promise.resolve(0),
            ]).then(([registrations, cacheEntries]) => {
                if (navigator.serviceWorker.controller || registrations > 0 || cacheEntries > 0) {
                    sessionStorage.setItem('ape-kade-dev-sw-cleared', '1');
                    location.reload();
                }
            });
        }
    </script>
</head>
<body>
<div id="root"></div>
<script type="module" src="./src/main.tsx"></script>
</body>
</html>
